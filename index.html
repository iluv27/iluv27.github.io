<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Merge - 2048 Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.2);
            padding: 48px 32px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3rem);
            color: #222;
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: clamp(1.05rem, 2vw, 1.4rem);
            color: #555;
            font-weight: 500;
        }

        .description {
            margin: 0 0 28px;
            color: #666;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .play-button {
            display: inline-block;
            background: #1f9d55;
            color: #fff;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 10px 22px rgba(31, 157, 85, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(31, 157, 85, 0.35);
        }

        .policy-link {
            display: inline-block;
            margin-top: 26px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .policy-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emoji Merge - 2048 Puzzle</h1>
        <p class="subtitle">A fun and simple emoji merging puzzle game.</p>
        <p class="description">
            Merge matching emojis, keep playing, and try to reach 2048.
        </p>

        <a
            class="play-button"
            href="https://play.google.com/store/apps/details?id=com.oghogho.emojimerge"
            target="_blank"
            rel="noopener noreferrer"
        >
            Download on Google Play
        </a>

        <br />

        <a
            class="policy-link"
            href="https://github.com/iluv27/privacy-policy-mergemojics"
            target="_blank"
            rel="noopener noreferrer"
        >
            Privacy Policy
        </a>
    </div>
</body>
</html>
